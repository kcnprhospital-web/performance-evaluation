/* ---------- header ---------- */
header{background:var(--navy);color:#fff;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--red)}
.hwrap{max-width:1120px;margin:0 auto;padding:14px 16px 18px;display:flex;align-items:center;gap:14px}
.hlogo{width:56px;height:56px;border-radius:50%;background:#fff;object-fit:contain;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.htxt{flex:1;min-width:0}
.htxt .h1{font-weight:700;font-size:19px;line-height:1.35}
html[lang=km] .htxt .h1{font-family:'Moul',serif;font-weight:400;font-size:17px;line-height:1.7}
.htxt .h2{font-size:13.5px;opacity:.85}
.net{font-size:12.5px;display:flex;align-items:center;gap:6px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;background:#6BE39A;display:inline-block}
.dot.off{background:#FFB0A8}
.hbtn{background:#fff;color:var(--navy);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}

/* ---------- tabs ---------- */
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:6px 10px;overflow-x:auto}
.tab{flex:1;min-width:max-content;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border:0;background:none;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{background:var(--navy-50)}
.tab.on{background:var(--navy);color:#fff}
main{max-width:1120px;margin:0 auto;padding:18px 16px 40px}
.narrow{max-width:760px;margin:0 auto}
.demo{background:var(--warn-50);border:1px solid #F0C98A;color:#6B4300;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:15px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:19px;color:var(--navy-d);display:flex;align-items:center;gap:10px}
.card h3{margin:16px 0 8px;font-size:17px}
.sec-ico{width:38px;height:38px;border-radius:12px;background:var(--navy-50);color:var(--navy);display:grid;place-items:center;flex:none}

/* ---------- hero (evaluate) ---------- */
.hero{background:var(--navy-d);color:#fff;border-radius:var(--r-lg);padding:22px 22px 18px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;overflow:hidden;position:relative}
.hero h1{margin:0;font-size:22px;line-height:1.5}
html[lang=km] .hero h1{font-family:'Moul',serif;font-weight:400;font-size:19px;line-height:1.9}
.hero p{margin:6px 0 0;opacity:.85;font-size:15px;max-width:46ch}
.hero .medal{width:92px;height:auto}
.steps{grid-column:1/-1;list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:12.5px;opacity:.6}
.steps li::before{content:"";height:5px;border-radius:5px;background:rgba(255,255,255,.25)}
.steps li.on{opacity:1}
.steps li.on::before{background:#fff}
.steps li.done{opacity:1}
.steps li.done::before{background:#6BE39A}

/* ---------- forms ---------- */
label.f{display:block;font-weight:600;margin:12px 0 6px;font-size:15.5px}
.inp{width:100%;padding:11px 14px;border:1.5px solid #CDD3E3;border-radius:var(--r-sm);background:#fff;min-height:50px}
.inp:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--navy-100)}
textarea.inp{min-height:80px;resize:vertical}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{padding-left:42px}
.row{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}.row.c4{grid-template-columns:repeat(4,1fr)}}
.person{display:none;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:var(--r);background:var(--navy-50)}
.person.on{display:flex}
.person b{display:block;line-height:1.35}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:16px}
.av.sm{width:34px;height:34px;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600;background:#fff;color:var(--navy)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg label{border:1.5px solid #CDD3E3;border-radius:var(--r);padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;text-align:center;font-size:15px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label .i{width:26px;height:26px;color:var(--muted)}
.seg label.dis{opacity:.4;cursor:not-allowed}
.seg label:has(input:checked){border-color:var(--navy);background:var(--navy-50);font-weight:700;color:var(--navy-d)}
.seg label:has(input:checked) .i{color:var(--navy)}
.seg label:has(input:focus-visible){outline:3px solid #8FA0F0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer;font-size:15.5px}
.chk input{width:22px;height:22px;flex:none;margin-top:3px;accent-color:var(--navy)}
.btn{border:0;border-radius:var(--r-sm);padding:11px 20px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--navy-d)}
.btn.sec{background:var(--navy-50);color:var(--navy-d)}
.btn.sec:hover{background:var(--navy-100)}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{background:var(--gold-d)}
.btn.bad{background:var(--bad-50);color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.big{min-height:54px;padding:12px 26px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.err{background:var(--bad-50);color:var(--bad);border-radius:var(--r-sm);padding:10px 14px;margin-top:12px;display:none;font-weight:600}
.donebox{background:var(--ok-50);color:#155E3A;border-radius:var(--r-sm);padding:10px 14px;margin-top:12px;font-size:15px;display:none}

/* ---------- criteria ---------- */
.rated{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14.5px;color:var(--muted)}
.rated .track{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.rated .track i{display:block;height:100%;width:0;background:var(--navy);transition:width .25s}
.crit{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;background:#fff;transition:border-color .2s}
.crit.done{border-color:var(--navy-100);background:#FBFCFF}
.ct{display:flex;gap:12px;align-items:flex-start}
.cico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--navy-50);color:var(--navy)}
.crit.done .cico{background:var(--navy);color:#fff}
.ctitle{font-weight:700;line-height:1.4}
.cnum{color:var(--muted);font-weight:600;margin-right:4px}
.cdesc{font-size:14.5px;color:var(--muted);margin-top:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.sb{border:1.5px solid #D5DAE7;background:#fff;border-radius:12px;padding:6px 2px 7px;cursor:pointer;text-align:center;min-height:76px;transition:transform .12s, background .15s}
.sb .face{display:block;font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.55}
.sb b{display:block;font-size:18px;line-height:1.2}
.sb span{display:block;font-size:11px;color:var(--muted);line-height:1.25}
.sb:hover{border-color:#9AA5C8}
.sb.on{color:#fff;border-color:transparent;transform:translateY(-2px)}
.sb.on .face{filter:none;opacity:1}
.sb.on span{color:#fff}
.sb.on.v1{background:var(--s1)}.sb.on.v2{background:var(--s2)}.sb.on.v3{background:var(--s3)}.sb.on.v4{background:var(--s4)}.sb.on.v5{background:var(--s5)}
.anchtog{background:none;border:0;color:var(--navy);font-size:14px;cursor:pointer;padding:6px 0 0;font-weight:600}
.anch{display:none;font-size:14px;margin-top:6px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.anch div{padding:7px 12px}
.anch .hi{background:#EAF6EF}
.anch .lo{background:#FCEEEE}
.crit.open .anch{display:block}

/* ---------- sticky score bar with dial ---------- */
.dock{position:sticky;bottom:10px;z-index:15;margin-top:16px;background:var(--navy-d);color:#fff;border-radius:var(--r-lg);padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(30,40,112,.25)}
.dock .gauge{width:92px;flex:none}
.dock .lbl{font-size:13px;opacity:.8}
.dock .score{font-size:26px;font-weight:700;line-height:1.1}
.dock .grow{flex:1;min-width:0}
.dock .btn{background:#fff;color:var(--navy-d)}
#tab-eval{padding-bottom:6px}
@media(max-width:560px){
  .dock{padding:8px 10px;gap:8px}
  .dock .gauge{width:70px}
  .dock .score{font-size:22px}
  .dock .btn.big{min-height:46px;padding:10px 14px;font-size:15.5px}
  .tabs{gap:2px;padding:4px 6px}
  .tab{flex-direction:column;gap:2px;padding:6px 4px;font-size:12.5px;min-width:0;line-height:1.25;text-align:center}
  .tab svg.i{width:20px;height:20px}
  .hwrap{padding:12px 14px 16px}
  .hlogo{width:48px;height:48px}
  .hero{padding:18px 16px 14px}
  .hero .medal{width:66px}
  .card{padding:16px}
}
.dock .btn:hover{background:var(--navy-50)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.lv0{background:var(--ok-50);color:#167A47}.lv1{background:#E3F2F5;color:#1D6F80}.lv2{background:var(--navy-50);color:var(--navy)}.lv3{background:var(--warn-50);color:var(--warn)}.lv4{background:var(--bad-50);color:var(--bad)}

/* ---------- lock ---------- */
.lock{text-align:center;max-width:440px;margin:24px auto;padding:30px 24px}
.lock .lk{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;background:var(--navy-50);color:var(--navy);display:grid;place-items:center}
.lock .lk .i{width:34px;height:34px}
.lock h2{justify-content:center}

/* ---------- results ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{border-radius:var(--r);padding:12px 14px;background:var(--paper);display:flex;gap:10px;align-items:center}
.stat .sec-ico{background:#fff}
.stat b{display:block;font-size:22px;color:var(--navy-d);line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.hall{background:linear-gradient(180deg,#1E2870 0%,#2B3990 100%);color:#fff;border-radius:var(--r-lg);padding:22px 16px 0;margin-bottom:16px;overflow:hidden}
.hall h2{margin:0 0 4px;text-align:center;font-size:20px}
html[lang=km] .hall h2{font-family:'Moul',serif;font-weight:400;font-size:18px;line-height:1.9}
.hall .sub{text-align:center;opacity:.8;font-size:14px;margin-bottom:16px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;max-width:640px;margin:0 auto}
.pcol{text-align:center;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.pcol .av{width:58px;height:58px;font-size:20px;border:3px solid #fff;margin-bottom:6px}
.pcol.p1 .av{width:76px;height:76px;font-size:24px;border-color:#F3C969}
.pcol .pn{font-weight:700;line-height:1.35;font-size:15px;padding:0 4px}
html[lang=km] .pcol.p1 .pn{font-family:'Moul',serif;font-weight:400;font-size:15px;line-height:1.9}
.pcol .pd{font-size:12px;opacity:.75;line-height:1.3;padding:0 4px}
.pcol .ps{font-size:20px;font-weight:700;margin:4px 0 6px}
.step{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:10px;font-size:26px;font-weight:800;color:rgba(255,255,255,.95)}
.p1 .step{height:120px;background:linear-gradient(180deg,#E4B755,#B8862A)}
.p2 .step{height:86px;background:linear-gradient(180deg,#C3CAD8,#8E98AE)}
.p3 .step{height:62px;background:linear-gradient(180deg,#D89A6C,#B06A3B)}
.pempty{opacity:.45;cursor:default}
.champs{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:16px}
@media(min-width:720px){.champs{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.champs{grid-template-columns:repeat(4,1fr)}}
.champ{border-radius:var(--r);padding:14px;background:var(--gold-50);border:1px solid #EBD6A6;display:flex;flex-direction:column;gap:6px}
.champ .top{display:flex;gap:10px;align-items:center}
.champ .medal{width:40px;flex:none}
.champ .lab{font-size:13px;color:var(--gold-d);font-weight:600;line-height:1.35}
.champ .nm{font-size:17px;font-weight:700;line-height:1.35}
.champ .sc{font-size:22px;font-weight:700;color:var(--gold-d)}
.champ.none{background:#fff;border:1.5px dashed var(--line);color:var(--muted)}
.champ.none .medal{opacity:.35;filter:grayscale(1)}
.dist{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0}
.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#F7F8FC;font-weight:600;white-space:nowrap;font-size:13.5px;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7F9FF}
.who{display:flex;align-items:center;gap:10px}
.rk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--paper);font-weight:700;font-size:14px}
.rk.g{background:#F3C969;color:#5C4108}.rk.s{background:#D6DBE6}.rk.b{background:#E6B999;color:#5A2E10}
.fbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.fbar .bar{width:70px}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-size:13px}
.bar{height:8px;background:#E8ECF4;border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--navy);border-radius:6px}
.cbars .cb{display:grid;grid-template-columns:28px minmax(120px,1.3fr) 2fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.cbars .cb .cico{width:28px;height:28px;border-radius:8px}
.cbars .cb .cico .i{width:17px;height:17px}
.cbars .cb.low .bar i{background:var(--s2)}
details.how{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
details.how summary{cursor:pointer;font-weight:600;color:var(--navy-d)}
details.how li{margin:5px 0;font-size:15px}
.radarwrap{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.mhead{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding-right:44px}
@media(min-width:720px){.radarwrap{grid-template-columns:300px 1fr}}
.radar{width:100%;max-width:320px;margin:0 auto;display:block}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(21,28,58,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:20px 10px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:var(--r-lg);max-width:880px;width:100%;padding:22px;position:relative}
.mclose{position:absolute;right:12px;top:10px;border:0;background:var(--paper);width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:60;display:none;max-width:90vw;text-align:center;font-weight:600}
.toast.on{display:block;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- plans ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600;color:var(--c);background:#EEF0FA;background:color-mix(in srgb,var(--c) 12%,#fff);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.planhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ringbox{text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tile{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:var(--r);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.tile:hover{border-color:var(--navy-100);background:#FBFCFF}
.tmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cnt{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
.cnt svg.i{width:16px;height:16px}
.cnt.ach{color:var(--ok)}
.pitem{display:grid;grid-template-columns:34px 1fr auto;gap:12px;border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;background:#fff;align-items:start}
.pnum{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.pnum.dv{border-radius:10px;background:var(--gold-50);color:var(--gold-d)}
.pnum.dv svg.i{width:19px;height:19px}
.pbody{min-width:0}
.pbody label.f:first-child{margin-top:0}
.ptext{font-weight:600;line-height:1.5}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:14px;color:var(--muted);align-items:center}
.pmeta span{display:inline-flex;align-items:center;gap:4px}
.pmeta svg.i{width:16px;height:16px}
.plbl{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.presult{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.rpills{display:flex;flex-wrap:wrap;gap:6px}
.rp{border:1.5px solid #CDD3E3;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;background:#fff;display:inline-flex;align-items:center}
.rp input{position:absolute;opacity:0;pointer-events:none}
.rp:has(input:focus-visible){outline:3px solid #8FA0F0}
.rp:has(input:checked),.rp.on{color:#fff;border-color:transparent;font-weight:600}
.r100:has(input:checked),.r100.on{background:var(--s5)}.r75:has(input:checked),.r75.on{background:var(--s4)}
.r50:has(input:checked),.r50.on{background:var(--s2)}.r0:has(input:checked),.r0.on{background:var(--s1)}
.ds-todo:has(input:checked){background:var(--s3)}.ds-doing:has(input:checked){background:var(--navy)}.ds-done:has(input:checked){background:var(--s5)}
.ds{border-radius:999px;padding:1px 10px;font-weight:600;font-size:13px;color:#fff;background:var(--s3)}
.ds.ds-doing{background:var(--navy)}.ds.ds-done{background:var(--s5)}
.xbtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--paper);color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.xbtn:hover{background:var(--bad-50);color:var(--bad)}
@media(max-width:560px){.pitem{grid-template-columns:1fr auto;padding:12px}.pitem .pnum{grid-row:1;grid-column:1}.pitem .pbody{grid-column:1/-1;grid-row:2}.pitem .xbtn{grid-row:1;grid-column:2}}
@media(max-width:560px){.pdock .grow{display:none}.pdock .bt{display:none}.pdock .btn{flex:1;padding:8px 10px;font-size:14.5px;min-height:46px}.pdock .btn[data-pprint]{flex:0 0 46px}}
/* same highlights for browsers without :has() (set by syncSel in JS) */
.seg label.sel{border-color:var(--navy);background:var(--navy-50);font-weight:700;color:var(--navy-d)}
.seg label.sel .i{color:var(--navy)}
.rp.on,.rp.sel{color:#fff;border-color:transparent;font-weight:600}
.r100.on,.r100.sel{background:var(--s5)}.r75.on,.r75.sel{background:var(--s4)}.r50.on,.r50.sel{background:var(--s2)}.r0.on,.r0.sel{background:var(--s1)}
.ds-todo.sel{background:var(--s3)}.ds-doing.sel{background:var(--navy)}.ds-done.sel{background:var(--s5)}
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
#print{display:none}

/* ---------- print ---------- */
@page{size:A4;margin:12mm}
@page cert{size:A4 landscape;margin:8mm}
@media print{
  body{background:#fff;font-size:12.5px}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  table{font-size:11.5px}
  th,td{padding:4px 6px;border:1px solid #999;color:#000}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tw{border:0;overflow:visible}
  .cert{page:cert}
  .radar{max-width:260px}
}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.rh-left{text-align:center;width:46%}
.rh-left img{width:64px;height:64px;object-fit:contain}
.rh-left .hn{font-family:'Moul',serif;font-size:12.5px;line-height:1.7}
.rh-right{text-align:center;width:46%;font-family:'Moul',serif;font-size:13.5px;line-height:1.9}
.orn{font-family:'Kantumruy Pro';letter-spacing:4px;font-size:14px}
.rtitle{text-align:center;font-family:'Moul',serif;font-size:15px;margin:12px 0 4px;line-height:1.8}
.rsub{text-align:center;margin-bottom:10px}
.sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;margin-top:24px}
.sig div{min-height:90px}
.cert{border:10px double var(--gold);padding:22px 40px;text-align:center;min-height:180mm;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fffdf6}
.cert .motto{font-family:'Moul',serif;font-size:16px;line-height:1.9}
.cert img{width:80px;height:80px;object-fit:contain;margin:6px 0}
.cert .ttl{font-family:'Moul',serif;font-size:36px;color:var(--gold);margin:6px 0 0}
.cert .ttle{letter-spacing:3px;font-size:15px;color:#555}
.cert .who{font-family:'Moul',serif;font-size:30px;color:var(--navy);margin:14px 0 4px;display:block}
.cert p{font-size:17px;margin:6px 0}
.cert .csig{display:flex;justify-content:flex-end;margin-top:18px}
.cert .csig div{text-align:center;min-width:280px}

const DEMO = !/^https:\/\/script\.google\.com\//.test(CONFIG.API_URL);
function jsonp(params, timeout=25000){
  return new Promise((resolve, reject) => {
    const cb = 'kcpe_cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const s = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, timeout);
    function done(){ clearTimeout(timer); window[cb] = () => {}; s.remove(); }
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = CONFIG.API_URL + '?' + new URLSearchParams({...params, callback: cb, _: Date.now()}).toString();
    document.head.appendChild(s);
  });
}
function api(params){ return DEMO ? demoApi(params) : jsonp(params); }

function demoPlans(p, staff, evals, admin){
  const plans = LS.get('kcpe_demo_plans', []), items = LS.get('kcpe_demo_items', []);
  const save = () => { LS.set('kcpe_demo_plans', plans); LS.set('kcpe_demo_items', items); };
  const okPeriod = x => /^\d{4}-S[12]$/.test(String(x||''));
  const auth = () => { const r = staff.find(s => String(s.id)===String(p.raterId)); if (!r) return {err:'Evaluator not found'};
    if (String(r.code).trim() !== String(p.code||'').trim()) return {err:'BADCODE'}; if (!isYes(r.active)) return {err:'Inactive'}; return {r}; };
  const manages = (r, s) => !!r && !!s && String(r.id)!==String(s.id) && isYes(r.supervisor) && isYes(s.active) && (r.department===s.department || r.department==='Hospital Management');
  const pid = (per, sid) => 'P-'+per+'-'+sid;
  const summary = pl => { const it = items.filter(i => i.planId===pl.id), tg = it.filter(i => i.kind==='target'), rs = tg.filter(i => i.result!=='').map(i => +i.result);
    return {staffId:String(pl.staffId), status:pl.status, nT:tg.length, nD:it.filter(i=>i.kind==='dev').length, ach: rs.length ? mean(rs) : null, agreedAt: pl.staffAgreedAt||''}; };
  if (p.action==='plans'){ if (!admin) return {ok:false,error:'BADPIN'}; const ps = plans.filter(x => x.period>=p.from && x.period<=p.to); const ids = new Set(ps.map(x=>x.id)); return {ok:true, plans:ps, items:items.filter(i=>ids.has(i.planId))}; }
  if (p.action==='planList'){
    if (!okPeriod(p.period)) return {ok:false,error:'Invalid period'}; const a = auth(); if (a.err) return {ok:false,error:a.err};
    const team = staff.filter(s => manages(a.r, s)), ids = new Set([...team.map(s=>String(s.id)), String(a.r.id)]), sums = {};
    plans.filter(x => x.period===p.period && ids.has(String(x.staffId))).forEach(x => sums[String(x.staffId)] = summary(x));
    return {ok:true, me: sums[String(a.r.id)] || null, team: team.map(s=>String(s.id)), plans:sums, isSupervisor: isYes(a.r.supervisor)};
  }
  if (p.action==='planGet'){
    if (!okPeriod(p.period)) return {ok:false,error:'Invalid period'}; const a = auth(); if (a.err) return {ok:false,error:a.err};
    const s = staff.find(x => String(x.id)===String(p.staffId)); if (!s) return {ok:false,error:'Staff member not found'};
    const self = String(a.r.id)===String(s.id), canEdit = manages(a.r, s);
    if (!self && !canEdit) return {ok:false, error:'You can only open your own plan or plans of staff you supervise'};
    const id = pid(p.period, s.id), plan = plans.find(x => x.id===id) || null;
    // context: latest evaluated period <= this one, weighted like Code.gs
    const ev = evals.filter(e => String(e.rateeId)===String(s.id) && e.period<=p.period && !(e.relation==='peer' && e.flag==='SL'));
    let context = null;
    if (ev.length){ const last = ev.map(e=>e.period).sort().pop(), use = ev.filter(e=>e.period===last), W = {supervisor:50, peer:40, self:10};
      let ws = 0, sc = 0; const crit = CRITERIA.map(()=>0);
      Object.keys(W).forEach(k => { const g = use.filter(e=>e.relation===k); if (!g.length) return; ws += W[k]; sc += W[k]*mean(g.map(e=>+e.score)); crit.forEach((_,i) => crit[i] += W[k]*mean(g.map(e=>+e['c'+(i+1)]))); });
      if (ws) context = {period:last, n:use.length, score: Math.round(sc/ws*10)/10, crit: crit.map(v => Math.round(v/ws*100)/100)}; }
    return {ok:true, plan, items: plan ? items.filter(i=>i.planId===id).sort((x,y)=>x.ord-y.ord) : [], canEdit, isSelf:self, context};
  }
  if (p.action==='planSave'){
    const d = JSON.parse(p.d||'{}'); if (!okPeriod(d.period)) return {ok:false,error:'Invalid period'}; const a = auth(); if (a.err) return {ok:false,error:a.err};
    const s = staff.find(x => String(x.id)===String(d.staffId)); if (!s) return {ok:false,error:'Staff member not found'};
    if (!manages(a.r, s)) return {ok:false, error:'Only the supervisor of this staff member can edit the plan'};
    const id = pid(d.period, s.id), now = new Date().toISOString();
    let pl = plans.find(x => x.id===id); if (!pl){ pl = {id, period:d.period, staffId:String(s.id), status:'draft', created:now}; plans.push(pl); }
    Object.assign(pl, {staffName:s.nameKh||s.nameEn, staffDept:s.department, supervisorId:String(a.r.id), supervisorName:a.r.nameKh||a.r.nameEn, updated:now});
    if (d.header) pl.supervisorNote = String(d.header.supervisorNote||'').slice(0,300);
    if (d.final && d.review){ pl.status = 'reviewed'; pl.reviewedAt = now; }
    (d.items||[]).forEach(it => { const rec = {...it, planId:id, updated:now}; const k = items.findIndex(x => x.id===it.id); if (k>=0) items[k] = rec; else items.push(rec); });
    if (d.final && Array.isArray(d.keep)){ const keep = new Set(d.keep.map(String)); for (let k = items.length-1; k >= 0; k--) if (items[k].planId===id && !keep.has(String(items[k].id))) items.splice(k,1); }
    save(); return {ok:true, id};
  }
  if (p.action==='planAgree'){
    if (!okPeriod(p.period)) return {ok:false,error:'Invalid period'}; const a = auth(); if (a.err) return {ok:false,error:a.err};
    const pl = plans.find(x => x.id===pid(p.period, a.r.id)); if (!pl) return {ok:false, error:'No plan yet'};
    pl.staffAgreedAt = new Date().toISOString(); pl.staffComment = String(p.comment||'').slice(0,300); if (pl.status!=='reviewed') pl.status = 'agreed';
    save(); return {ok:true};
  }
}
// Mirrors the validation in Code.gs (used by demo mode only — the server is the authority).
function validateSubmission(d, staff){
  const rater = staff.find(s => String(s.id)===String(d.raterId));
  const ratee = staff.find(s => String(s.id)===String(d.rateeId));
  if(!rater) return {ok:false, error:'Evaluator not found'};
  if(String(rater.code).trim() !== String(d.code||'').trim()) return {ok:false, error:'BADCODE'};
  if(!isYes(rater.active)) return {ok:false, error:'Evaluator is inactive'};
  if(!ratee || !isYes(ratee.active)) return {ok:false, error:'Staff member not found or inactive'};
  if(!/^\d{4}-S[12]$/.test(d.period||'') || d.period > curSem()) return {ok:false, error:'Invalid period'};
  let relation = 'peer';
  if(String(rater.id)===String(ratee.id)) relation = 'self';
  else if(d.relation==='supervisor'){ if(!isYes(rater.supervisor)) return {ok:false, error:'NOT_SUPERVISOR'}; if(!(rater.department===ratee.department || rater.department==='Hospital Management')) return {ok:false, error:'NOT_SAME_DEPT'}; relation='supervisor'; }
  const sc = (d.scores||[]).map(Number);
  if(sc.length!==CRITERIA.length || sc.some(v => !(v>=1 && v<=5 && Math.round(v)===v))) return {ok:false, error:'Scores must be 1–5 for all criteria'};
  const avg = mean(sc), rec = {id: d.cid || ('E'+Date.now()), timestamp:new Date().toISOString(), period:d.period, raterId:rater.id, raterName:rater.nameKh||rater.nameEn, raterDept:rater.department,
    rateeId:ratee.id, rateeName:ratee.nameKh||ratee.nameEn, rateeDept:ratee.department, rateeGroup:ratee.group, relation,
    avg: Math.round(avg*100)/100, score: Math.round(avg/5*1000)/10, flag: (sc.every(v=>v===sc[0]) && (sc[0]===1 || sc[0]===5)) ? 'SL' : '',
    strengths:d.strengths||'', improve:d.improve||'', comment:d.comment||''};
  sc.forEach((v,i) => rec['c'+(i+1)] = v);
  return {ok:true, rec};
}

function gaugeSVG(score){
  const cx = 60, cy = 62, r = 48;
  const pt = (v, rr=r) => { const a = Math.PI * (1 - (Math.max(40, v) - 40)/60); return [cx + rr*Math.cos(a), cy - rr*Math.sin(a)]; };
  const arc = (a, b, col) => { const [x1,y1] = pt(a), [x2,y2] = pt(b); return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}A${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${col}" stroke-width="10" fill="none"/>`; };
  let s = arc(40.5,59.5,'#E05B5B') + arc(60.5,69.5,'#F0A04B') + arc(70.5,79.5,'#8E9BF0') + arc(80.5,89.5,'#5CC3D6') + arc(90.5,99.5,'#46CF85');
  if (score != null){ const [x,y] = pt(score, r-16); s += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`; }
  return s + `<circle cx="${cx}" cy="${cy}" r="6" fill="#fff"/>`;
}
function radarSVG(r){
  const N = CRITERIA.length, cx = 160, cy = 150, R = 108;
  const P = (i, v) => { const a = -Math.PI/2 + i * 2*Math.PI/N; return [cx + R*v/5*Math.cos(a), cy + R*v/5*Math.sin(a)]; };
  let g = '';
  for (let lv = 1; lv <= 5; lv++) g += `<polygon points="${CRITERIA.map((_,i) => P(i,lv).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="${lv===3?'#F1F3F9':'none'}" stroke="#DDE1EC" stroke-width="1"/>`;
  CRITERIA.forEach((_,i) => { const [x,y] = P(i,5); const [lx,ly] = P(i,6.05);
    g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#DDE1EC"/>`;
    g += `<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="700" fill="#5A6482">${kn(i+1)}</text>`; });
  const series = [['supervisor','#2B3990',''], ['peer','#2E8FA3',''], ['self','#B8862A','5 4']];
  series.forEach(([k,col,dash]) => { if (!r.cc[k]) return;
    const pts = r.cc[k].map((v,i) => P(i, v).map(n=>n.toFixed(1)).join(',')).join(' ');
    g += `<polygon points="${pts}" fill="${col}" fill-opacity="${k==='self'?0:.14}" stroke="${col}" stroke-width="2.4" stroke-dasharray="${dash}"/>`; });
  const legend = series.filter(([k]) => r.cc[k]).map(([k,col]) => `<span style="--c:${col}">${esc(t(k==='supervisor'?'sup':k))}</span>`).join('');
  return `<svg class="radar" viewBox="0 0 320 300" role="img" aria-label="${esc(t('indTitle'))}">${g}</svg><div class="legend" style="justify-content:center">${legend}</div>`;
}

const outbox = () => LS.get('kcpe_outbox', []);
function updateNet(){
  const on = navigator.onLine;
  $('#netdot').classList.toggle('off', !on);
  $('#nettxt').textContent = on ? t('online') : t('offline');
  const n = outbox().length;
  $('#obx').textContent = n ? ` · ${kn(n)} ${t('pending')}` : '';
}
let flushing = false;
async function flush(){
  if (flushing || !navigator.onLine) return;
  flushing = true;
  try {
    const tried = new Set();
    let item;
    while ((item = outbox().find(x => !tried.has(x.cid)))){
      tried.add(item.cid);
      let r;
      try { r = await api({action:'submit', d: JSON.stringify(item)}); } catch(e){ break; }   // offline / timeout: keep everything, retry later
      if (!r || r.retry) break;                                                               // server busy: keep it, retry later
      LS.set('kcpe_outbox', outbox().filter(x => x.cid !== item.cid));
      if (r.ok){ markDone(item); }
      else {
        unmarkDone(item);
        toast(t('rejected') + (byId[item.rateeId] ? staffName(byId[item.rateeId])+' — ' : '') + errText(r.error), 7000);
      }
    }
  } finally { flushing = false; updateNet(); renderDone(); fillRatee(); }
}
window.addEventListener('online', () => { updateNet(); flush(); });
window.addEventListener('offline', updateNet);
setInterval(flush, 30000);

function achMap(){
  const m = {}, P = (RES && RES.plans) || {plans:[], items:[]};
  P.plans.forEach(pl => { const v = P.items.filter(i => i.planId===pl.id && i.kind==='target' && i.result!=='' && i.result!=null).map(i => +i.result);

  Object.keys(m).forEach(k => m[k] = mean(m[k]));
  return m;
}
function compute(evals, opt){
  const by = {}; let excluded = 0;
  evals.forEach(e => {
    const id = String(e.rateeId);
    const st = byId[id] || {id, nameKh:e.rateeName, department:e.rateeDept, group:e.rateeGroup};
    if (opt.group && st.group!==opt.group) return;
    if (opt.dept && st.department!==opt.dept) return;
    const r = by[id] = by[id] || {id, st, self:[], peer:[], supervisor:[], all:[]};
    e.score = +e.score; for (let i=1;i<=CRITERIA.length;i++) e['c'+i] = +e['c'+i];
    r.all.push(e);
    if (opt.excludeSL && e.relation==='peer' && e.flag==='SL'){ excluded++; return; }
    (r[e.relation] || r.peer).push(e);
  });
  const W = CONFIG.WEIGHTS;
  const rows = Object.values(by).map(r => {
    const peerRaters = new Set(r.peer.map(e => String(e.raterId))).size;
    const supRaters = new Set(r.supervisor.map(e => String(e.raterId))).size;
    let peers = [...r.peer].sort((a,b) => a.score-b.score), trimmed = false;
    if (peerRaters >= CONFIG.TRIM_FROM && peers.length >= 3){ peers = peers.slice(1,-1); trimmed = true; }
    const comp = {supervisor:r.supervisor, peer:peers, self:r.self}, cs = {}, cc = {};
    Object.keys(comp).forEach(k => { if (comp[k].length){ cs[k] = mean(comp[k].map(e=>e.score)); cc[k] = CRITERIA.map((_,i) => mean(comp[k].map(e=>e['c'+(i+1)]))); } });
    let ws = 0, fs = 0; const crit = CRITERIA.map(()=>0);
    Object.keys(W).forEach(k => { if (cs[k]!=null){ ws += W[k]; fs += W[k]*cs[k]; cc[k].forEach((v,i) => crit[i] += W[k]*v); } });
    const achV = (opt.ach || {})[r.id]; let wsF = ws, fsF = fs;
    if (W.targets && achV != null && ws){ wsF += W.targets; fsF += W.targets * achV; }
    const final = wsF ? fsF/wsF : null; const critF = crit.map(v => ws ? v/ws : null);
    const reasons = [];
    if (supRaters < CONFIG.MIN_SUPERVISOR) reasons.push('noSup');
    if (peerRaters < CONFIG.MIN_PEERS) reasons.push('fewPeers');
    if (critF.some(v => v!=null && v < CONFIG.MIN_CRITERION)) reasons.push('lowCrit');
    return {...r, peerRaters, supRaters, trimmed, cs, cc, final, ach: achV ?? null, crit:critF, eligible: !reasons.length, reasons};
  }).filter(r => r.final!=null);
  rows.sort((a,b) => (b.final-a.final) || ((b.cs.supervisor||0)-(a.cs.supervisor||0)) || (b.peerRaters-a.peerRaters) || ((b.crit[0]||0)-(a.crit[0]||0)));
  rows.forEach((r,i) => r.rank = i+1);
  const champs = {overall: rows.find(r => r.eligible) || null};
  Object.keys(GROUPS).forEach(g => champs[g] = rows.find(r => r.eligible && r.st.group===g) || null);
  const evaluatedIds = new Set(rows.map(r => r.id));
  const notYet = STAFF.filter(s => !evaluatedIds.has(String(s.id)) && (!opt.group || s.group===opt.group) && (!opt.dept || s.department===opt.dept));
  const used = rows.reduce((n,r) => n + r.all.length, 0);
  return {rows, champs, excluded, notYet, nEvals: used};
}
function reasonText(r){ return r.reasons.map(k => k==='fewPeers' ? t('r_fewPeers')+kn(CONFIG.MIN_PEERS) : t('r_'+k)).join('; '); }
function renderResults(){
  const opt = {group:$('#fGroup').value, dept:$('#fDept').value, excludeSL:$('#exSL').checked, ach: achMap()};
  RES.c = compute(RES.evals, opt); RES.opt = opt;

  const minV = Math.min(...critAll.map(x => x.v));

/* ---- Excel import: reads KCPH-style staff lists (Khmer or English headings, title rows above the table) ---- */
const KH_RE = /[ក-៿]/;
const COLS = [ // field, header patterns (first match wins, checked in this order)
  ['id',         [/^(id|staff ?id|employee ?id|emp ?id|no\.? ?id)$/i, /អត្តលេខ/, /លេខសម្គាល់/]],
  ['nameEn',     [/latin|english|roman|ឡាតាំង|អង់គ្លេស/i]],
  ['nameKh',     [/khmer|ខ្មែរ/i, /^(ឈ្មោះ|គោត្តនាម|នាមត្រកូល|ឈ្មោះបុគ្គលិក|ឈ្មោះមន្ត្រី|full ?name|name|staff ?name)/i]],
  ['sex',        [/^(sex|gender|ភេទ)/i]],
  ['position',   [/position|title|role|designation|មុខតំណែង|តួនាទី|មុខងារ|ឋានៈ/i]],
  ['department', [/department|dept|unit|ward|section|service|ផ្នែក|ការិយាល័យ|អង្គភាព|សេវា/i]],
  ['group',      [/^(group|category|staff ?group|ក្រុម|ប្រភេទបុគ្គលិក|ប្រភេទ)/i]],
  ['supervisor', [/supervisor|ជាប្រធាន|អ្នកគ្រប់គ្រង/i]],
  ['active',     [/^(active|status|ស្ថានភាព)/i]]
];
function mapHeader(row){
  const map = {};
  row.forEach((cell, ci) => {
    const h = String(cell||'').trim().replace(/\s+/g,' ');
    if (!h) return;
    for (const [field, res] of COLS){
      if (map[field]!=null) continue;
      if (res.some(re => re.test(h))){ map[field] = ci; break; }
    }
  });
  return map;
}
function findTable(wb){
  let best = null;
  wb.SheetNames.forEach(sn => {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:false, blankrows:true});
    for (let r = 0; r < Math.min(aoa.length, 20); r++){
      const map = mapHeader(aoa[r]);
      if (map.nameKh==null && map.nameEn==null) continue;
      const score = Object.keys(map).length;
      if (!best || score > best.score) best = {sheet:sn, headerRow:r, map, score, aoa};
    }
  });
  return best;
}
function normDept(v){
  const s = String(v||'').trim(); if (!s) return '';
  const low = s.toLowerCase();
  const hit = DEPTS.find(d => d[0].toLowerCase()===low || d[1]===s) ||
              DEPTS.find(d => s.includes(d[1].replace(/^ផ្នែក/,'').trim()) && d[1].replace(/^ផ្នែក/,'').trim().length>2) ||
              DEPTS.find(d => low.includes(d[0].toLowerCase()));
  return hit ? hit[0] : s;
}
function normGroup(v, position, dept){
  const s = String(v||'').trim(), up = s.toUpperCase();
  if (GROUPS[up]) return up;
  for (const g of Object.keys(GROUPS)) if (s && (GROUPS[g][0]===s || GROUPS[g][1].toLowerCase()===s.toLowerCase())) return g;
  const txt = (s+' '+(position||'')+' '+(dept||'')).toLowerCase();
  if (/doctor|physician|surgeon|dentist|medical officer|វេជ្ជ|គ្រូពេទ្យ|ទន្តបណ្ឌិត|ទន្តពេទ្យ/.test(txt)) return 'MD';
  if (/nurse|midwi|គិលានុបដ្ឋា|ឆ្មប/.test(txt)) return 'NM';
  if (/lab|pharm|x-?ray|radiolog|imaging|ultrasound|physio|anaesth|anesth|ពិសោធ|ឱសថ|កាំរស្មី|រូបភាព|ចលនា|សណ្តំ|ធនាគារឈាម/.test(txt)) return 'AH';
  return 'AS';
}
function normSex(v){ const s = String(v||'').trim().toLowerCase(); if (/^(f|female|ស្រី)/.test(s)) return 'F'; if (/^(m|male|ប្រុស)/.test(s)) return 'M'; return ''; }
function parseStaff(tbl){
  const {aoa, headerRow, map} = tbl, out = [], skipped = [];
  const get = (row, f) => map[f]==null ? '' : String(row[map[f]] ?? '').trim();
  for (let r = headerRow+1; r < aoa.length; r++){
    const row = aoa[r];
    let nameKh = get(row,'nameKh'), nameEn = get(row,'nameEn');
    if (nameKh && !KH_RE.test(nameKh) && !nameEn){ nameEn = nameKh; nameKh = ''; }   // a single "Name" column written in Latin script
    if (!nameKh && !nameEn){ if (row.some(c => String(c).trim())) skipped.push(r+1); continue; }
    const position = get(row,'position'), deptRaw = get(row,'department');
    const supRaw = get(row,'supervisor'), actRaw = get(row,'active');
    out.push({
      id: get(row,'id'), nameKh, nameEn, sex: normSex(get(row,'sex')), position,
      department: normDept(deptRaw) || 'Other',
      group: normGroup(get(row,'group'), position, deptRaw),
      supervisor: map.supervisor!=null ? (isYes(supRaw) ? 'Y' : 'N')
                  : (/head|chief|director|manager|ប្រធាន|នាយក/i.test(position) ? 'Y' : 'N'),
      active: (!actRaw || isYes(actRaw) || /^(active|working|កំពុង)/i.test(actRaw)) ? 'Y' : 'N',
      _row: r+1
    });
  }
  return {list: out, skipped};
}

function importDialog(html){ $('#mbody').innerHTML = `<h2 style="margin-top:0">${esc(t('importXls'))}</h2>` + html; $('#modal').classList.add('on'); }
async function runImport(list){
  const btn = $('#impGo'), prog = $('#impProg'); btn.disabled = true;
  // batch by URL size (Khmer text is ~9 bytes per character once URL-encoded)
  const batches = []; let cur = [];
  list.forEach(s => { const {_row, ...rec} = s; const next = [...cur, rec];
    if (cur.length && encodeURIComponent(JSON.stringify(next)).length > 5500){ batches.push(cur); cur = [rec]; } else cur = next; });
  if (cur.length) batches.push(cur);
  let n = 0;
  for (const b of batches){
    let r = null;
    try { r = await api({action:'saveStaff', pin:PIN, d:JSON.stringify(b)}); } catch(err){ r = {ok:false, error: t('netErr')+' ('+err.message+')'}; }
    if (!r || !r.ok){
      prog.innerHTML = `<p class="no">${esc(L('បានបញ្ឈប់','Stopped'))} — ${kn(n)} / ${kn(list.length)} ${esc(L('បានរក្សាទុក','saved'))}. ${esc(L('កំហុស','Error'))}: <b>${esc(r && r.error === 'BADPIN' ? L('PIN មិនត្រឹមត្រូវ ឬផុតកំណត់ — សូមចាកចេញ ហើយចូលម្តងទៀត','PIN wrong or expired — log out and in again') : (r && r.error) || '?')}</b></p>`;
      btn.disabled = false; await loadAdminStaff(); return;
    }
    n += r.saved; prog.textContent = `${t('imported')}${kn(n)} / ${kn(list.length)}…`;
  }
  prog.innerHTML = `<p class="ok">✓ ${esc(t('imported'))}${kn(n)} ${esc(L('នាក់','staff'))}</p>`;
  btn.textContent = L('រួចរាល់ — បិទ','Done — close'); btn.disabled = false; btn.onclick = () => $('#modal').classList.remove('on');
  $('#admQ').value = ''; $('#admDept').value = '';
  await loadAdminStaff(); loadStaff();
}

function monthShort(v){ if (!/^\d{4}-\d{2}$/.test(v||'')) return v||''; const [y,m] = v.split('-'); return lang==='kh' ? `${KH_MONTHS[+m-1]} ${knAlways(y)}` : `${EN_MONTHS[+m-1].slice(0,3)} ${y}`; }
function statusChip(st){ const s = PLAN_STATUS[st] || PLAN_STATUS.none; return `<span class="chip" style="--c:${s[2]}">${esc(L(s[0],s[1]))}</span>`; }
function areaLabel(a){ return a==='other' || !a ? t('areaOther') : (CRITERIA[+a-1] ? L(CRITERIA[+a-1].kh, CRITERIA[+a-1].en) : a); }
function typeLabel(v){ const x = ACTION_TYPES.find(a => a[0]===v); return x ? L(x[1],x[2]) : (v||''); }
function resultLabel(v){ const x = RESULTS.find(a => a[0]===String(v)); return x ? L(x[1],x[2]) : '–'; }
function devStatusLabel(v){ const x = DEV_STATUS.find(a => a[0]===v); return x ? L(x[1],x[2]) : ''; }
function ringSVG(v, size=70){
  const r = 28, c = 2*Math.PI*r, col = v>=90 ? '#1F9D5C' : v>=70 ? '#2E8FA3' : v>=50 ? '#E58A2B' : '#D64545';
  return `<svg width="${size}" height="${size}" viewBox="0 0 70 70" role="img" aria-label="${esc(t('achievement'))} ${Math.round(v)}%"><circle cx="35" cy="35" r="${r}" fill="none" stroke="#E8ECF4" stroke-width="8"/>
    <circle cx="35" cy="35" r="${r}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 35 35)"/>
    <text x="35" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#151C3A">${Math.round(v)}%</text></svg>`;
}
function planErrText(e){
  if (e==='No plan yet') return t('noPlanYet');

async function openPlans(){
  const raterId = $('#plRater').value, code = $('#plCode').value.trim(), period = $('#plPeriod').value;
  if (!raterId) return toast(t('eRater'));
  if (!code) return toast(t('eCode'));
  const b = $('#plOpen'); b.disabled = true;
  let r = null; try { r = await api({action:'planList', raterId, code, period}); } catch(e){}
  b.disabled = false;
  if (!r) return toast(t('netErr'));
  if (!r.ok) return toast(planErrText(r.error));
  PL = {raterId, code, period, list:r, cur:null};
  LS.set('kcpe_me', raterId);
  renderPlanHome();
}
async function refreshPlanList(){ try { const r = await api({action:'planList', raterId:PL.raterId, code:PL.code, period:PL.period}); if (r.ok) PL.list = r; } catch(e){} }
function renderPlanHome(){
  if (!PL) { $('#planOut').innerHTML = ''; return; }
  const r = PL.list, me = byId[PL.raterId] || {id:PL.raterId};
  const mine = r.me;
  const team = r.team.map(id => byId[id]).filter(Boolean).sort((a,b) => staffName(a).localeCompare(staffName(b)));
  const stOf = id => (r.plans[id] && r.plans[id].status) || 'none';
  const counts = {none:0, draft:0, agreed:0, reviewed:0}; team.forEach(s => counts[stOf(s.id)]++);
  const tile = s => { const p = r.plans[s.id];
    return `<button class="tile" data-plan="${esc(s.id)}">
      <div class="who">${avatar(s)}<div><b>${esc(staffName(s))}</b><div class="muted small">${esc(s.position||deptLabel(s.department))}</div></div></div>
      <div class="tmeta">${statusChip(stOf(s.id))}${p ? `<span class="cnt">${ico('target')}${kn(p.nT)}</span><span class="cnt">${ico('bulb')}${kn(p.nD)}</span>` : ''}
      ${p && p.ach!=null ? `<span class="cnt ach">${kn(Math.round(p.ach))}%</span>` : ''}</div></button>`; };
  $('#planOut').innerHTML = `
    <div class="card"><h2><span class="sec-ico">${ico('user')}</span>${esc(t('myPlan'))} — ${esc(semLabel(PL.period))}</h2>
      <div class="planhead">${avatar(me)}<div style="flex:1;min-width:0"><b>${esc(staffName(me))}</b><div class="muted small">${esc(me.position||'')}${me.position?' — ':''}${esc(deptLabel(me.department))}</div>
        <div style="margin-top:4px">${statusChip(mine ? mine.status : 'none')}</div></div>
        ${mine && mine.ach!=null ? ringSVG(mine.ach) : ''}
        <button class="btn" data-plan="${esc(me.id)}" ${mine ? '' : 'disabled'}>${esc(t('openPlan'))}</button></div>
      ${mine ? '' : `<p class="muted" style="margin:10px 0 0">${esc(t('noPlanYet'))}</p>`}
      ${mine && mine.status==='draft' ? `<p class="muted" style="margin:10px 0 0">${esc(L('សូមបើក អាន ហើយចុច «ឯកភាព» នៅខាងក្រោមផែនការ។','Please open it, read it and press "agree" at the bottom of the plan.'))}</p>` : ''}
    </div>
    ${r.isSupervisor ? `<div class="card"><h2><span class="sec-ico">${ico('team')}</span>${esc(t('myTeam'))} (${kn(team.length)})</h2>
      ${team.length ? `<div class="dist">${['reviewed','agreed','draft','none'].map(k => counts[k] ? `<i style="width:${counts[k]/team.length*100}%;background:${PLAN_STATUS[k][2]}"></i>` : '').join('')}</div>
      <div class="legend" style="margin-bottom:12px">${['reviewed','agreed','draft','none'].map(k => `<span style="--c:${PLAN_STATUS[k][2]}">${esc(L(PLAN_STATUS[k][0],PLAN_STATUS[k][1]))} (${kn(counts[k])})</span>`).join('')}</div>
      <div class="tiles">${team.map(tile).join('')}</div>` : `<p class="muted">${esc(t('noData'))}</p>`}</div>`

$('#planOut').addEventListener('click', e => {
  const p = e.target.closest('[data-plan]'); if (p && !p.disabled) return openPlan(p.dataset.plan);
  if (e.target.closest('[data-back]')) { refreshPlanList().then(renderPlanHome); return; }
  if (e.target.closest('[data-addt]')) { syncPlan(); const n = PL.cur.items.filter(i=>i.kind==='target').length; if (n >= MAX_T) return; PL.cur.items.push(blankItem('target')); renderPlanEditor(); return; }
  if (e.target.closest('[data-addd]')) { syncPlan(); const n = PL.cur.items.filter(i=>i.kind==='dev').length; if (n >= MAX_D) return; PL.cur.items.push(blankItem('dev')); renderPlanEditor(); return; }
  const g = e.target.closest('[data-goal]');
  if (g){ syncPlan(); if (PL.cur.items.filter(i=>i.kind==='dev').length >= MAX_D) return; const it = blankItem('dev'); it.area = g.dataset.goal; it.actionType = 'training'; PL.cur.items.push(it); renderPlanEditor(); $('#dList').lastElementChild.scrollIntoView({behavior:'smooth', block:'center'}); return; }
  const rm = e.target.closest('[data-rm]'); if (rm){ syncPlan(); PL.cur.items = PL.cur.items.filter(i => i.id !== rm.dataset.rm); renderPlanEditor(); return; }
  if (e.target.closest('[data-save]')) return savePlan(false);
  if (e.target.closest('[data-review]')) return savePlan(true);
  if (e.target.closest('[data-pprint]')) { syncPlan(); return printHTML(reportHeader() + planPrintHTML() ); }
  if (e.target.closest('[data-agree]')) return agreePlan();
});
$('#planOut').addEventListener('change', e => { if (e.target.matches('input[type=radio][name^="res-"], select[data-f=area]')) { syncPlan(); updatePlanRing(); } });

/* ---- editor ---- */
function blankItem(kind){ return {id:newItemId(), kind, text:'', measure:'', targetValue:'', area:'', actionType:'', support:'', due:'', result:'', resultNote:'', status:kind==='dev'?'todo':''}; }
async function openPlan(staffId){
  let r = null; try { r = await api({action:'planGet', raterId:PL.raterId, code:PL.code, period:PL.period, staffId}); } catch(e){}
  if (!r) return toast(t('netErr'));
  if (!r.ok) return toast(planErrText(r.error));
  const items = (r.items||[]).map(i => ({...blankItem(i.kind), ...i, result: i.result===''||i.result==null ? '' : String(i.result)}));
  if (r.canEdit && !items.length){ items.push(blankItem('target'), blankItem('target'), blankItem('target'), blankItem('dev')); }
  PL.cur = {staffId:String(staffId), plan:r.plan, items, canEdit:r.canEdit, isSelf:r.isSelf, context:r.context};
  renderPlanEditor();
  $('#tab-plan').scrollIntoView({behavior:'smooth'});
}

    : (String(it.result)===v ? `<span class="rp r${v} on">${esc(L(kh,en))}</span>` : '')).join('');
  return `<div class="pitem" data-kind="target" data-id="${esc(it.id)}"><span class="pnum">${kn(i+1)}</span><div class="pbody">

      ${ed ? `<input class="inp" data-f="resultNote" maxlength="200" placeholder="${esc(t('tNote'))}" value="${esc(it.resultNote)}" style="margin-top:8px">`

function devHTML(it, i, ed, period){
  const areaIdx = +it.area;
  const icon = areaIdx >= 1 && areaIdx <= 8 ? CRIT_ICONS[areaIdx-1] : 'bulb';
  if (!ed) return `<div class="pitem dev" data-kind="dev" data-id="${esc(it.id)}"><span class="pnum dv">${ico(icon)}</span><div class="pbody">
      <div class="plbl">${esc(areaLabel(it.area))} — ${esc(typeLabel(it.actionType))}</div><div class="ptext">${esc(it.text)}</div>
      <div class="pmeta">${it.support?`<span>${ico('team')}${esc(it.support)}</span>`:''}${it.due?`<span>${ico('clock')}${esc(monthShort(it.due))}</span>`:''}<span class="ds ds-${esc(it.status||'todo')}">${esc(devStatusLabel(it.status||'todo'))}</span></div></div></div>`;
  return `<div class="pitem dev" data-kind="dev" data-id="${esc(it.id)}"><span class="pnum dv">${ico(icon)}</span><div class="pbody">
    <div class="row c2"><div><label class="f">${esc(t('dArea'))}</label><select class="inp" data-f="area"><option value="">${esc(t('choose'))}</option>
      ${CRITERIA.map((c,k) => `<option value="${k+1}" ${String(it.area)===String(k+1)?'selected':''}>${kn(k+1)}. ${esc(L(c.kh,c.en))}</option>`).join('')}<option value="other" ${it.area==='other'?'selected':''}>${esc(t('areaOther'))}</option></select></div>
    <div><label class="f">${esc(t('dType'))}</label><select class="inp" data-f="actionType"><option value="">${esc(t('choose'))}</option>
      ${ACTION_TYPES.map(a => `<option value="${a[0]}" ${it.actionType===a[0]?'selected':''}>${esc(L(a[1],a[2]))}</option>`).join('')}</select></div></div>
    <label class="f">${esc(t('dText'))}</label><textarea class="inp" data-f="text" maxlength="200" rows="2">${esc(it.text)}</textarea>
    <div class="row c2"><div><label class="f">${esc(t('dSupport'))}</label><input class="inp" data-f="support" maxlength="150" value="${esc(it.support)}"></div>
    <div><label class="f">${esc(t('dDue'))}</label><select class="inp" data-f="due"><option value="">${esc(t('choose'))}</option>
      ${dueOptions(period).map(m => `<option value="${m}" ${it.due===m?'selected':''}>${esc(monthShort(m))}</option>`).join('')}</select></div></div>
    <label class="f">${esc(t('dStatus'))}</label><div class="rpills">${DEV_STATUS.map(([v,kh,en]) => `<label class="rp ds-${v}"><input type="radio" name="dst-${it.id}" value="${v}" ${(it.status||'todo')===v?'checked':''}>${esc(L(kh,en))}</label>`).join('')}</div>
  </div><button type="button" class="xbtn" data-rm="${esc(it.id)}" aria-label="${esc(t('remove'))}">×</button></div>`;
}
function contextHTML(c, ed){
  if (!c.canEdit && !c.isSelf) return '';
  if (!c.context) return `<div class="card muted">${ico('chart')} ${esc(t('noEvalYet'))}</div>`;
  const cx = c.context, order = cx.crit.map((v,i) => ({v,i})).sort((a,b) => a.v-b.v), low = new Set(order.slice(0,2).map(x => x.i));
  return `<div class="card"><h2><span class="sec-ico">${ico('chart')}</span>${esc(t('lastEval'))}</h2>
    <div class="muted small" style="margin:-6px 0 8px">${esc(semLabel(cx.period))} — <b>${r1(cx.score)}</b>/100 ${levelPill(cx.score)}</div>
    <div class="cbars">${cx.crit.map((v,i) => `<div class="cb ${low.has(i)?'low':''}"><span class="cico">${ico(CRIT_ICONS[i])}</span><span>${esc(L(CRITERIA[i].kh,CRITERIA[i].en))}</span><div class="bar"><i style="width:${(v/5*100).toFixed(0)}%"></i></div><b>${v.toFixed(2)}</b></div>`).join('')}</div>
    ${ed ? `<div class="plbl" style="margin-top:12px">${esc(t('focus'))}</div><div class="btns" style="margin-top:6px">${order.slice(0,2).map(x => `<button class="btn sec sm" data-goal="${x.i+1}">${ico('plus')}${esc(L(CRITERIA[x.i].kh,CRITERIA[x.i].en))}</button>`).join('')}</div>` : ''}
  </div>`;
}

    <div class="card"><h2><span class="sec-ico">${ico('target')}</span>${esc(t('targets'))} <span class="muted small">(${kn(tg.length)}/${kn(MAX_T)})</span></h2>
      ${ed ? `<div class="muted small" style="margin:-4px 0 12px">${esc(t('targetsHelp'))}</div>` : ''}
      <div id="tList">${tg.map((it,i) => targetHTML(it,i,ed)).join('') || `<p class="muted">–</p>`}</div>
      ${ed && tg.length < MAX_T ? `<button class="btn sec" data-addt>${ico('plus')}${esc(t('addTarget'))}</button>` : ''}
      ${ed ? `<div class="muted small" style="margin-top:10px">${esc(t('notEnded'))}</div>` : ''}</div>

      ${ed ? `<div class="muted small" style="margin:-4px 0 12px">${esc(t('devHelp'))}</div>` : ''}
      <div id="dList">${dv.map((it,i) => devHTML(it,i,ed,PL.period)).join('') || `<p class="muted">–</p>`}</div>
      ${ed && dv.length < MAX_D ? `<button class="btn sec" data-addd>${ico('plus')}${esc(t('addDev'))}</button>` : ''}</div>
    <div class="card"><h2><span class="sec-ico">${ico('msg')}</span>${esc(t('supNote'))}</h2>
      ${ed ? `<textarea class="inp" id="plNote" maxlength="300">${esc(note)}</textarea>` : `<p style="margin:0">${esc(note) || '<span class="muted">–</span>'}</p>`}
      <h3>${esc(t('agreeTitle'))}</h3>
      ${agreed ? `<div class="donebox" style="display:block">✓ ${esc(t('agreedOn'))}${esc(String(agreed).slice(0,10))}${c.plan.staffComment ? `<div style="margin-top:4px">${esc(t('staffComment'))}: ${esc(c.plan.staffComment)}</div>` : ''}</div>`
        : c.isSelf ? `<label class="f">${esc(t('yourComment'))}</label><textarea class="inp" id="plComment" maxlength="300"></textarea>
            <div class="btns"><button class="btn big" data-agree>${ico('shield')}${esc(t('agreeBtn'))}</button></div>`
        : `<p class="muted" style="margin:0">${esc(t('notAgreed'))}</p>`}
    </div>
    ${ed ? `<div class="dock pdock">
        <div class="grow"><div class="lbl">${esc(semLabel(PL.period))}</div><b>${esc(staffName(s))}</b></div>
        <button class="btn sm" data-pprint style="background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)">${ico('print')}<span class="bt">${esc(t('printPlan'))}</span></button>
        <button class="btn sm" data-review style="background:#46CF85;color:#0B3B22">${ico('task')}${esc(t('completeReview'))}</button>
        <button class="btn big" data-save>${ico('down')}${esc(t('savePlan'))}</button></div>`
      : `<div class="btns"><button class="btn sec" data-pprint>${ico('print')}${esc(t('printPlan'))}</button></div>`}`;
  syncSel($('#planOut'));
}
function syncPlan(){
  const c = PL.cur; if (!c || !c.canEdit) return;
  const byIdI = Object.fromEntries(c.items.map(i => [i.id, i]));
  const out = [];
  $$('#planOut .pitem').forEach((el, k) => {
    const it = byIdI[el.dataset.id] || blankItem(el.dataset.kind);
    el.querySelectorAll('[data-f]').forEach(f => it[f.dataset.f] = f.value.trim());
    const rr = el.querySelector(`input[name="res-${it.id}"]:checked`); if (el.dataset.kind==='target') it.result = rr ? rr.value : '';
    const ds = el.querySelector(`input[name="dst-${it.id}"]:checked`); if (el.dataset.kind==='dev') it.status = ds ? ds.value : 'todo';
    it.ord = k; out.push(it);
  });
  c.items = out;
  if ($('#plNote')) { c.plan = c.plan || {}; c.plan.supervisorNote = $('#plNote').value.trim(); }
}
function updatePlanRing(){ const a = achOf(PL.cur.items); $('#planRing').innerHTML = a!=null ? ringSVG(a, 78) + `<div class="muted small">${esc(t('achievement'))}</div>` : ''; }
async function savePlan(review){
  syncPlan();
  const c = PL.cur;
  c.items = c.items.filter(i => i.text);
  const tg = c.items.filter(i => i.kind==='target');
  if (!tg.length){ renderPlanEditor(); return toast(t('needOne')); }
  if (review && tg.some(i => i.result==='')) return toast(t('needResults'), 4500);
  if (review && !confirm(t('completeReview') + '?')) return;
  const base = {period:PL.period, staffId:c.staffId};
  const header = {supervisorNote: (c.plan && c.plan.supervisorNote) || ''};
  const send = c.items.map((it,k) => ({id:it.id, kind:it.kind, ord:k, text:it.text, measure:it.measure, targetValue:it.targetValue, area:it.area,
    actionType:it.actionType, support:it.support, due:it.due, result:it.result, resultNote:it.resultNote, status:it.status}));
  // GET requests must stay short: Khmer text is ~9 bytes per character once URL-encoded
  const chunks = []; let cur = [];
  send.forEach(it => { const next = [...cur, it]; if (cur.length && encodeURIComponent(JSON.stringify({...base, header, items:next})).length > 4500){ chunks.push(cur); cur = [it]; } else cur = next; });
  chunks.push(cur);
  $$('#planOut [data-save], #planOut [data-review]').forEach(b => b.disabled = true);
  toast(t('saving'), 1500);
  try {
    for (let k = 0; k < chunks.length; k++){
      const last = k === chunks.length-1;
      const d = {...base, items:chunks[k], header: k===0 ? header : null, final:last, keep: last ? send.map(i => i.id) : null, review: last && review};
      const r = await api({action:'planSave', raterId:PL.raterId, code:PL.code, d:JSON.stringify(d)});
      if (!r || !r.ok) throw new Error(planErrText(r && r.error));
    }
    toast(review ? t('reviewDone') : t('planSaved'));
    await openPlan(c.staffId);
  } catch(e){
    toast((e.message==='network'||e.message==='timeout') ? t('netErr') : e.message, 5000);
    $$('#planOut [data-save], #planOut [data-review]').forEach(b => b.disabled = false);
  }
}
async function agreePlan(){
  const comment = ($('#plComment') && $('#plComment').value.trim()) || '';
  let r = null; try { r = await api({action:'planAgree', raterId:PL.raterId, code:PL.code, period:PL.period, comment}); } catch(e){}
  if (!r) return toast(t('netErr'));
  if (!r.ok) return toast(planErrText(r.error));
  toast(t('agreedOk')); await refreshPlanList(); openPlan(PL.raterId);
}

    <tbody>${dv.map((it,i) => `<tr><td>${kn(i+1)}</td><td>${esc(areaLabel(it.area))}</td><td>${esc(typeLabel(it.actionType))}</td><td>${esc(it.text)}</td><td>${esc(it.support)}</td><td>${esc(monthShort(it.due))}</td><td>${esc(devStatusLabel(it.status||'todo'))}</td></tr>`).join('') || '<tr><td colspan="7">–</td></tr>'}</tbody></table></div>

}
